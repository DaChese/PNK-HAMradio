
services:
  etherpad:
    image: etherpad/etherpad:latest
    platform: linux/arm64
    container_name: etherpad
    restart: unless-stopped
    ports:
      - '9001:9001'
    volumes:
      # persist your pads & settings
      - ./matrix-pnk/etherpad/var:/opt/etherpad-lite/var

  filebrowser:
    image: filebrowser/filebrowser:v2-arm64-s6
    platform: linux/arm64
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - '8081:80'
    volumes:
      - ./matrix-pnk/filebrowser/database:/database
      - ./matrix-pnk/filebrowser/files:/srv

  kolibri:
    image: treehouses/kolibri:0.10.3
    platform: linux/arm64
    container_name: kolibri
    restart: unless-stopped
    ports:
      - '8082:8080'
    volumes:
      - ./matrix-pnk/kolibri-content:/root/.kolibri

  unifi-controller:
    image: jacobalberty/unifi:latest 
    platform: linux/arm64
    container_name: unifi-controller
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MEM_LIMIT=1024
    volumes:
      - ./matrix-pnk/unifi/config:/config
      - ./matrix-pnk/unifi/data:/var/lib/unifi

  hackchat:
    build:
      context: ./matrix-pnk/hackchat
      dockerfile: Dockerfile
    container_name: hackchat
    ports:
      - "6060:6060"   # WebSocket
      - "8083:3000"     # HTTP static site (frontend UI)
    restart: unless-stopped






