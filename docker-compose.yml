
services:
  etherpad:
    image: etherpad/etherpad:latest
    platform: linux/arm64
    container_name: etherpad
    user: "5000:5000"     
    environment:
      - NODE_ENV=production
    ports:
      - "9001:9001"
    volumes:
      - ./matrix-pnk/etherpad/var:/opt/etherpad-lite/var
    restart: unless-stopped


  filebrowser:
    image: filebrowser/filebrowser:v2-arm64-s6
    platform: linux/arm64
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - '8081:80'
    volumes:
      - ./matrix-pnk/filebrowser/database:/database
      - ./matrix-pnk/filebrowser/files:/srv

  kolibri:
    build: 
      context: ./matrix-pnk/kolibri-docker
    container_name: kolibri
    restart: unless-stopped
    ports:
    - "8082:8070"   # host:container — clients still use host:8082
    volumes:
    - ./matrix-pnk/kolibri-content:/root/.kolibri
    environment:
    - TZ=UTC
    mem_limit: 1536m
    command: ["kolibri", "start", "--port", "8070", "--foreground"]

  unifi-controller:
    image: jacobalberty/unifi:latest 
    platform: linux/arm64
    container_name: unifi-controller
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MEM_LIMIT=1024
    volumes:
      - ./matrix-pnk/unifi/config:/config
      - ./matrix-pnk/unifi/data:/var/lib/unifi

  openwebrx:
    image: jketterl/openwebrx:stable   # or :latest
    container_name: openwebrx
    restart: unless-stopped
    network_mode: "host"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"    # remove this if you switch to rtl_tcp-only
    volumes:
      - ./matrix-pnk/openwebrx:/var/lib/openwebrx
    environment:
      - TZ=Etc/UTC
    logging:
      driver: "journald"







    






