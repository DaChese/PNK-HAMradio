
services:
etherpad:
  image: etherpad/etherpad:1.9.7 
  container_name: etherpad
  restart: unless-stopped
  ports:
    - "9001:9001"
  environment:
    - TITLE=PNK Etherpad
    - TRUST_PROXY=true
    - DB_TYPE=dirty         # for small/offline use
    - ADMIN_PASSWORD=${EP_ADMIN_PASSWORD:-pnk}
  volumes:
    - ep-data:/opt/etherpad-lite/var


  filebrowser:
    image: filebrowser/filebrowser:v2-arm64-s6
    platform: linux/arm64
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - '8081:80'
    volumes:
      - ./matrix-pnk/filebrowser/database:/database
      - ./matrix-pnk/filebrowser/files:/srv

  kolibri:
    build: 
      context: ./matrix-pnk/kolibri-docker
    container_name: kolibri
    restart: unless-stopped
    ports:
    - "8082:8070"   # host:container — clients still use host:8082
    volumes:
    - ./matrix-pnk/kolibri-content:/root/.kolibri
    environment:
    - TZ=UTC
    mem_limit: 1536m
    command: ["kolibri", "start", "--port", "8070", "--foreground"]

  unifi-controller:
    image: jacobalberty/unifi:latest 
    platform: linux/arm64
    container_name: unifi-controller
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MEM_LIMIT=1024
    volumes:
      - ./matrix-pnk/unifi/config:/config
      - ./matrix-pnk/unifi/data:/var/lib/unifi


volumes:
  ep-data:







    






